events {}

http {
    # Define the rate limit zone, stored in Redis (using a local shared memory zone for simplicity in this K8s pod)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=3r/s;

    server {
        listen 80;
        
        location / {
            # Apply the rate limit
            limit_req zone=mylimit burst=5 nodelay;
            limit_req_status 429;

            # Forward the traffic to our FastAPI backend
            proxy_pass http://trafficcop-backend-svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
