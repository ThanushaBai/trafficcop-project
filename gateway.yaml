apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
        # 1. DDoS Protection (Rate Limiting)
        limit_req_zone $binary_remote_addr zone=mylimit:10m rate=3r/s;

        server {
            listen 80;
            
            location / {
                # Rate limit rule
                limit_req zone=mylimit burst=5 nodelay;
                limit_req_status 429;

                # 2. WAF Rule: Block SQL Injection attempts in the URL
                if ($args ~* "(\%27)|(\')|(\-\-)|(\%23)|(#)") {
                    return 403;
                }

                # Forward traffic to the backend
                proxy_pass http://trafficcop-backend-svc;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafficcop-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trafficcop-gateway
  template:
    metadata:
      labels:
        app: trafficcop-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: trafficcop-gateway-svc
spec:
  type: NodePort
  selector:
    app: trafficcop-gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
